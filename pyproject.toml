[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aurastream"
version = "1.0.0"
description = "AuraStream: Ambient Living Room Intelligence Engine for Amazon Fire TV"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "AuraStream Engineering Team" }
]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "mcp>=1.0.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "sse-starlette>=2.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
aurastream = "run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]
